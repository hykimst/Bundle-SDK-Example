<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    .container {
      position: relative;
      width: 750px;
      height: 500px;
      background: #000;
    }

    #showcase {
      width: 100%;
      height: 100%;
      border: 0;
      position: relative;
      /* Lower z-index so it stays behind the button */
      z-index: 1;
    }

    #fullscreenBtn {
      position: absolute;
      /* Higher z-index than the iframe */
      z-index: 9999;
      top: 10px;
      right: 10px;
      color: green;
      background-color: rgba(255, 240, 0, 0.1);
      border: 0;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Showcase Bundle SDK v25.11.2_webgl-1327-g527db53a6e</h1>
  <div class="container">
    <iframe id="showcase" width="700px" height="500px" frameborder="0" allowfullscreen
      allow="autoplay; fullscreen; web-share; xr-spatial-tracking;">
    </iframe>
    <button id="fullscreenBtn">
      TOGGLE FULLSCREEN
    </button>
  </div>

</body>

</html>
